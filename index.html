<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>La meva pagina de One Piece</title>
    <meta name="description" content="Pagina d'exemple de One Piece">
    <link rel="stylesheet" href="styles.css">
    <script src="code.js"></script>
</head>

<body>

    <h3>La meva pagina de One Piece</h3>

    <section id="buscador">
        <h2>Buscador</h2>
        <form>
            <input type="name" id="nomBusqueda" placeholder="Buscar..." required>
            <button id="botoBusqueda" onclick="fetchBusqueda(nomBusqueda)">Buscar</button>
        </form>
        <div id="llistaBusqueda"></div>

    </section>

    <section>
        <h2>Llista de personatges</h2>
        <button>Anterior</button>
        <button>Seguent</button>
        <div id="llistaPersonatges"></div>
    </section>


    <div id="recompenses">
        <h2>Recompenses</h2>
        <div id="numeroRecompenses"></div>
    </div>

    <div id="fruites">
        <h2>Fruites</h2>
    </div>

</body>
